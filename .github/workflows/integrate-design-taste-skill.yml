name: Integrate conditional frontend design skill

on:
  push:
    branches:
      - feat/conditional-design-taste-skill
    paths:
      - .github/workflows/integrate-design-taste-skill.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/conditional-design-taste-skill
          fetch-depth: 0

      - name: Update canonical workflow prompts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          SKILL_URL = "https://github.com/viseshrp/ai-skills-archive/blob/main/archives/Leonxlnx__taste-skill/snapshot/skills/taste-skill/SKILL.md"
          SKILL_BULLET = (
              f"- [design-taste-frontend]({SKILL_URL}) "
              "(conditional; apply only under the frontend-design applicability gate below)"
          )
          NO_AI_SLOP_BULLET = (
              "- [no-ai-slop](https://github.com/viseshrp/ai-skills-archive/blob/main/"
              "archives/petergyang__no-ai-slop/snapshot/skills/no-ai-slop/SKILL.md), "
              "including its required [eval.md](https://github.com/viseshrp/"
              "ai-skills-archive/blob/main/archives/petergyang__no-ai-slop/snapshot/"
              "skills/no-ai-slop/eval.md)"
          )

          PROMPTS = {
              "prompts/01_initial_exploration_any_model.md": (
                  "## Documentation checkpoint",
                  "In this exploration phase, use the skill only to clarify an eligible visual "
                  "frontend brief and preserve its decisions for planning. Do not implement UI. "
                  "When applicable, require the downstream planning prompt to produce a locked "
                  "`Frontend Design Contract` before execution."
              ),
              "prompts/02_plan_critique_gpt_gemini.md": (
                  "## Engineering Contract",
                  "In this critique phase, verify that an eligible visual frontend plan contains "
                  "a complete, source-grounded `Frontend Design Contract`. Treat missing objective "
                  "requirements, unapproved dependencies, and unauthorized brand, route, content, "
                  "information-architecture, form, or analytics changes as critique findings. Keep "
                  "purely subjective alternatives non-blocking unless the user or locked plan made "
                  "them requirements."
              ),
              "prompts/03_plan_revision_verification_gpt_gemini.md": (
                  "## Engineering Contract",
                  "In this verification phase, verify the previously agreed frontend-design "
                  "decisions and the revised `Frontend Design Contract`; do not reopen aesthetic "
                  "direction or introduce new preferences. Confirm that the execution prompt cannot "
                  "use the skill to add dependencies or widen scope."
              ),
              "prompts/04_opus_review_branch.md": (
                  "## Engineering Contract",
                  "In this branch-review phase, use the skill only for eligible visual frontend "
                  "surfaces. Review the rendered result at representative desktop and mobile "
                  "viewports when repository tooling permits. Ground blocking findings in the locked "
                  "contract, accessibility, responsive correctness, functionality, performance, "
                  "SEO, analytics, or repository requirements. Keep uncontracted aesthetic "
                  "preferences in `Suggestions`."
              ),
              "prompts/05_opus_verify_review_fixes.md": (
                  "## Engineering Contract",
                  "In this fix-verification phase, verify only the frontend-design findings already "
                  "accepted in `REVIEW.md` and the regenerated fix prompt. Recheck the affected "
                  "rendered viewports when possible, but do not invent a new design direction or "
                  "promote preferences into findings."
              ),
              "prompts/06_opus_refresh_review_and_walkthrough.md": (
                  "## Engineering Contract",
                  "In this final refresh phase, rerun the applicable rendered frontend preflight "
                  "against the final branch and locked contract. Refresh the review evidence without "
                  "adding new aesthetic preferences. A newly discovered objective regression is a "
                  "severe missed issue; a different taste preference is not."
              ),
              "prompts/08_gpt_implement_human_followup.md": (
                  "## Engineering Contract",
                  "In this follow-up phase, apply the skill only when an explicitly approved "
                  "`FOLLOWUP.md` item concerns an eligible visual frontend surface. The approved "
                  "item and any locked `Frontend Design Contract` control the change. Do not turn the "
                  "skill into permission for a broader redesign, new dependency, or unapproved "
                  "content, route, navigation, form, analytics, or architecture change."
              ),
          }

          BASE_GATE = dedent("""
          ## Conditional Frontend-Design Applicability

          `design-taste-frontend` is a conditional domain skill. Apply it only when the task affects one or more of these eligible surfaces:

          - a landing or marketing page,
          - a portfolio,
          - an editorial or brand page,
          - an explicitly approved visual redesign of one of those surfaces.

          Do not apply it to backend-only work, dashboards, admin or dense product interfaces, data tables, multi-step forms, native mobile interfaces, or general refactors. For a mixed task, apply it only to the eligible public-facing surface.

          The user request, locked planning artifacts, existing brand and design system, repository conventions, accessibility requirements, SEO and analytics contracts, and dependency-approval rules override every skill default. The skill never authorizes:

          - a new dependency or design system without explicit approval,
          - route, slug, primary-navigation, form-field, or analytics-event changes,
          - a content or information-architecture rewrite,
          - architecture changes or scope expansion,
          - replacing objective requirements with subjective taste.

          If applicability is false, do not use the skill and record `Frontend design: Not applicable` in the relevant phase artifact.

          {phase_rule}

          """)

          GENERATED_RULE_NEEDLE = (
              "- never use a skill to expand scope, add architecture changes, add tests, "
              "add unrelated refactors, or override my explicit instructions.\n"
          )
          GENERATED_RULE_ADDITION = dedent("""- load and apply `design-taste-frontend` only when the task matches the `## Conditional Frontend-Design Applicability` gate,
          - when it applies, treat the locked `Frontend Design Contract` and existing repository design system as authoritative; use the skill only as a supporting design and validation procedure,
          - when it does not apply, do not use it and record `Frontend design: Not applicable`,
          - never let it authorize a dependency, redesign, route, navigation, information-architecture, content, form, analytics, or architecture change beyond the user-approved artifacts.
          """)

          GENERATED_GATE_INSTRUCTIONS = dedent("""
          In `## Conditional Frontend-Design Applicability`, it must instruct the target agent to:

          - apply `design-taste-frontend` only to landing or marketing pages, portfolios, editorial or brand pages, and explicitly approved visual redesigns of those surfaces,
          - exclude backend-only work, dashboards, admin or dense product interfaces, data tables, multi-step forms, native mobile interfaces, and general refactors,
          - apply the skill only to eligible public-facing surfaces in a mixed task,
          - let the user request, locked artifacts, existing brand and design system, repository conventions, accessibility, SEO, analytics, and dependency-approval rules override skill defaults,
          - prohibit the skill from authorizing dependencies, design-system changes, route or slug changes, primary-navigation changes, form-field changes, analytics-event changes, content or information-architecture rewrites, architecture changes, or scope expansion,
          - record `Frontend design: Not applicable` and skip the skill when the gate is false.

          """)

          def replace_once(text: str, old: str, new: str, path: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one occurrence of {old!r}, found {count}")
              return text.replace(old, new, 1)

          def insert_before_once(text: str, anchor: str, block: str, path: str) -> str:
              count = text.count(anchor)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one insertion anchor {anchor!r}, found {count}")
              return text.replace(anchor, block + anchor, 1)

          def add_skill_links(text: str, path: str) -> str:
              text = text.replace(SKILL_BULLET + "\n" + NO_AI_SLOP_BULLET, NO_AI_SLOP_BULLET)
              count = text.count(NO_AI_SLOP_BULLET)
              if count < 1:
                  raise RuntimeError(f"{path}: no no-ai-slop skill bullets found")
              return text.replace(
                  NO_AI_SLOP_BULLET,
                  SKILL_BULLET + "\n" + NO_AI_SLOP_BULLET,
              )

          def add_generated_section_heading(text: str) -> str:
              text = text.replace(
                  "- `## Skill Handling Rule`\n- `## Default Planning Artifact Reduction`",
                  "- `## Skill Handling Rule`\n"
                  "- `## Conditional Frontend-Design Applicability`\n"
                  "- `## Default Planning Artifact Reduction`",
              )
              text = text.replace(
                  "- `## Skill Handling Rule`\n- `## Engineering Contract`",
                  "- `## Skill Handling Rule`\n"
                  "- `## Conditional Frontend-Design Applicability`\n"
                  "- `## Engineering Contract`",
              )
              return text

          def add_generated_skill_rules(text: str, path: str) -> str:
              text = text.replace(
                  GENERATED_RULE_NEEDLE + GENERATED_RULE_ADDITION,
                  GENERATED_RULE_NEEDLE,
              )
              count = text.count(GENERATED_RULE_NEEDLE)
              if count < 1:
                  raise RuntimeError(f"{path}: no generated skill-handling rule anchor found")
              return text.replace(
                  GENERATED_RULE_NEEDLE,
                  GENERATED_RULE_NEEDLE + GENERATED_RULE_ADDITION,
              )

          for path, (next_heading, phase_rule) in PROMPTS.items():
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              text = add_skill_links(text, path)
              if "\n## Conditional Frontend-Design Applicability\n" in text:
                  raise RuntimeError(f"{path}: applicability heading already exists unexpectedly")
              gate = BASE_GATE.format(phase_rule=phase_rule)
              text = insert_before_once(
                  text,
                  f"\n{next_heading}\n",
                  "\n" + gate,
                  path,
              )
              file_path.write_text(text, encoding="utf-8")

          path = "prompts/01_initial_exploration_any_model.md"
          p = Path(path)
          text = p.read_text(encoding="utf-8")
          text = add_generated_section_heading(text)
          text = add_generated_skill_rules(text, path)

          text = replace_once(
              text,
              "- Use `context-engineering` to identify what repo context matters and avoid context flooding.\n"
              "- Treat `no-ai-slop` as the hard writing requirement",
              "- Use `context-engineering` to identify what repo context matters and avoid context flooding.\n"
              "- When the applicability gate is true, use `design-taste-frontend` to clarify the page kind, audience, visual direction, existing brand and design-system constraints, preserve-versus-overhaul decision, responsive behavior, accessibility requirements, and prohibited changes. Do not implement UI in this phase.\n"
              "- Treat `no-ai-slop` as the hard writing requirement",
              path,
          )
          text = replace_once(
              text,
              "- user-visible behavior,\n- constraints,",
              "- user-visible behavior,\n"
              "- frontend-design applicability and, when applicable, the page kind, audience, visual direction, existing brand and design-system constraints, preserve-versus-overhaul decision, responsive and accessibility requirements, approved dependencies, prohibited changes, and required rendered-validation viewports,\n"
              "- constraints,",
              path,
          )
          text = insert_before_once(
              text,
              "In `## Default Planning Artifact Reduction`, it must instruct Opus",
              GENERATED_GATE_INSTRUCTIONS,
              path,
          )
          text = insert_before_once(
              text,
              "The generated Opus prompt must include the full Engineering Contract below and instruct Opus to embed that contract into `GPT_EXECUTION_PROMPT.md`.",
              GENERATED_GATE_INSTRUCTIONS,
              path,
          )

          FRONTEND_PLAN_REQUIREMENTS = dedent("""
          Required conditional frontend-design contract:

          - determine whether the task is eligible under `## Conditional Frontend-Design Applicability`,
          - when eligible, read `design-taste-frontend` and add a dedicated `## Frontend Design Contract` section to `FEATURE_SPEC_AND_PLAN.md`,
          - lock the page kind, audience, visual direction, existing brand and design-system constraints, preserve-versus-overhaul mode, layout, typography, spacing, motion, density, responsive behavior, accessibility, imagery and asset policy, SEO and analytics preservation, approved dependencies, prohibited changes, and representative desktop and mobile validation viewports,
          - distinguish objective requirements from optional aesthetic preferences,
          - require rendered validation through the repository's existing browser, preview, screenshot, or end-to-end tooling when available; if it is unavailable, require the limitation to be reported instead of claiming visual verification,
          - prohibit the skill from changing routes, slugs, primary navigation, form fields, analytics events, content, information architecture, dependencies, architecture, or scope unless the user explicitly approved that change,
          - when ineligible, write `Frontend design: Not applicable` in the planning artifacts and omit design-specific implementation requirements.

          """)
          text = insert_before_once(
              text,
              "Required design-question pass:",
              FRONTEND_PLAN_REQUIREMENTS,
              path,
          )
          text = replace_once(
              text,
              "- verify that the prompt and plan remain within the original requested scope.\n",
              "- verify that the prompt and plan remain within the original requested scope.\n"
              "- verify that frontend-design applicability is explicit and that any `Frontend Design Contract` is complete, approved, and narrower than or equal to the requested scope.\n",
              path,
          )
          text = replace_once(
              text,
              "Success criteria:\n\n- only the planned changes are implemented,",
              "Success criteria:\n\n"
              "- only the planned changes are implemented,\n"
              "- when `FEATURE_SPEC_AND_PLAN.md` contains a `Frontend Design Contract`, the implementation and rendered result satisfy it without introducing unapproved dependencies, redesign scope, or protected route, navigation, content, form, or analytics changes,",
              path,
          )
          text = replace_once(
              text,
              "- the implementation plan section inside `FEATURE_SPEC_AND_PLAN.md` is the execution contract,\n"
              "- the spec/reference section inside `FEATURE_SPEC_AND_PLAN.md` is reference context,",
              "- the implementation plan section inside `FEATURE_SPEC_AND_PLAN.md` is the execution contract,\n"
              "- the spec/reference section inside `FEATURE_SPEC_AND_PLAN.md` is reference context,\n"
              "- when present, the `Frontend Design Contract` is a locked part of that execution contract; use `design-taste-frontend` only to implement and validate those decisions,\n"
              "- when the plan records `Frontend design: Not applicable`, do not use the design skill,",
              path,
          )
          text = replace_once(
              text,
              "Execution rules:\n\n- read likely relevant files in parallel before editing when practical,",
              "Execution rules:\n\n"
              "- read likely relevant files in parallel before editing when practical,\n"
              "- when the locked plan includes a `Frontend Design Contract`, inspect the existing rendered surface before editing and validate the final result at the contract's representative desktop and mobile viewports using existing repository tooling when available,\n"
              "- do not install a library, switch design systems, generate assets, or alter protected routes, navigation, content, forms, or analytics merely because `design-taste-frontend` recommends a default; stop and ask when the contract does not already approve it,",
              path,
          )
          text = replace_once(
              text,
              "## Documentation Checkpoints\n\n## Commits Created",
              "## Documentation Checkpoints\n\n## Frontend Design Verification\n\n## Commits Created",
              path,
          )
          text = replace_once(
              text,
              "In `## Documentation Checkpoints`, require GPT to list each implementation-plan step's documentation status, the exact durable documentation and validation evidence when applicable, or the evidence-based `Not applicable` rationale.\n",
              "In `## Documentation Checkpoints`, require GPT to list each implementation-plan step's documentation status, the exact durable documentation and validation evidence when applicable, or the evidence-based `Not applicable` rationale.\n\n"
              "In `## Frontend Design Verification`, require GPT to state `Not applicable` when the gate is false. When it is true, require the locked contract, viewports, tooling, rendered checks, accessibility and responsive results, and any unverified limitation.\n",
              path,
          )
          p.write_text(text, encoding="utf-8")

          path = "prompts/02_plan_critique_gpt_gemini.md"
          p = Path(path)
          text = p.read_text(encoding="utf-8")
          text = add_generated_section_heading(text)
          text = add_generated_skill_rules(text, path)
          text = replace_once(
              text,
              "- missing per-implementation-step documentation checkpoints, durable documentation updates, validation, or evidence-based `Not applicable` decisions,\n"
              "- anything in the GPT prompt that gives GPT too much freedom.",
              "- missing per-implementation-step documentation checkpoints, durable documentation updates, validation, or evidence-based `Not applicable` decisions,\n"
              "- missing or incomplete frontend-design applicability and `Frontend Design Contract` decisions for an eligible surface,\n"
              "- frontend instructions that authorize an unapproved dependency, design-system switch, redesign, route, navigation, content, information-architecture, form, analytics, or architecture change,\n"
              "- subjective design preferences presented as blocking requirements without support from the user, locked plan, accessibility, responsive correctness, functionality, performance, SEO, analytics, or repository contracts,\n"
              "- anything in the GPT prompt that gives GPT too much freedom.",
              path,
          )
          text = replace_once(
              text,
              "## Documentation Checkpoint Gaps\n\n## GPT Prompt Risks",
              "## Documentation Checkpoint Gaps\n\n## Frontend Design Contract Review\n\n## GPT Prompt Risks",
              path,
          )
          text = insert_before_once(
              text,
              "The generated Opus revision prompt must include `## Default Planning Artifact Reduction` and require:",
              GENERATED_GATE_INSTRUCTIONS,
              path,
          )
          FRONTEND_REVISION_REQUIREMENTS = dedent("""
          Conditional frontend-design revision requirements:

          - preserve the established applicability decision instead of silently changing whether the skill applies,
          - when applicable, repair and retain the dedicated `## Frontend Design Contract` in `FEATURE_SPEC_AND_PLAN.md`,
          - ensure the contract locks objective design decisions, protected existing behavior, approved dependencies, and representative rendered-validation viewports,
          - remove or escalate any design instruction that would expand scope, switch dependencies or design systems, or alter routes, navigation, content, information architecture, forms, analytics, or architecture without approval,
          - keep subjective alternatives as optional suggestions unless the user or locked plan made them requirements,
          - preserve `Frontend design: Not applicable` when the task is outside the eligible surfaces,
          - preserve or strengthen the generated GPT execution prompt's conditional design-skill gate and rendered-verification requirements.

          """)
          text = insert_before_once(
              text,
              "Required outputs:\n\nUpdate or create:",
              FRONTEND_REVISION_REQUIREMENTS,
              path,
          )
          text = replace_once(
              text,
              "- verify that the updated plan is still within original scope,\n",
              "- verify that the updated plan is still within original scope,\n"
              "- verify that frontend-design applicability is explicit and any `Frontend Design Contract` is complete, approved, and enforced consistently by `GPT_EXECUTION_PROMPT.md`,\n",
              path,
          )
          p.write_text(text, encoding="utf-8")

          path = "prompts/03_plan_revision_verification_gpt_gemini.md"
          p = Path(path)
          text = p.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "- every implementation step in the revised plan and GPT prompt has a documentation checkpoint with an update-and-validation action or an evidence-based `Not applicable` decision,\n"
              "- the output follows the exact structure below.",
              "- every implementation step in the revised plan and GPT prompt has a documentation checkpoint with an update-and-validation action or an evidence-based `Not applicable` decision,\n"
              "- frontend-design applicability is explicit and, when applicable, the revised `Frontend Design Contract` is complete, unchanged in approved scope, and enforced by the GPT prompt without unapproved dependencies or protected-surface changes,\n"
              "- the output follows the exact structure below.",
              path,
          )
          text = replace_once(
              text,
              "- verify that every implementation step still maps to exact durable documentation and validation, or to an evidence-based `Not applicable` decision,\n"
              "- if the revision introduced a new problem, call it out explicitly instead of forcing a pass verdict.",
              "- verify that every implementation step still maps to exact durable documentation and validation, or to an evidence-based `Not applicable` decision,\n"
              "- when frontend design applies, verify the contract, conditional skill gate, approved dependencies, protected routes and behavior, and rendered-validation plan; when it does not, verify the explicit `Not applicable` decision,\n"
              "- do not introduce or require a new aesthetic preference during verification,\n"
              "- if the revision introduced a new problem, call it out explicitly instead of forcing a pass verdict.",
              path,
          )
          text = replace_once(
              text,
              "- Documentation checkpoints complete: Yes/No\n"
              "- Ready for GPT execution: Yes/No",
              "- Documentation checkpoints complete: Yes/No\n"
              "- Frontend design contract complete: Yes/No/Not applicable\n"
              "- Ready for GPT execution: Yes/No",
              path,
          )
          text = replace_once(
              text,
              "## Documentation Checkpoint Verification\n\n## Remaining Blocking Issues",
              "## Documentation Checkpoint Verification\n\n## Frontend Design Contract Verification\n\n## Remaining Blocking Issues",
              path,
          )
          p.write_text(text, encoding="utf-8")

          path = "prompts/04_opus_review_branch.md"
          p = Path(path)
          text = p.read_text(encoding="utf-8")
          text = add_generated_section_heading(text)
          text = add_generated_skill_rules(text, path)
          text = replace_once(
              text,
              "- the review and generated review-fix prompt remain usable without any artifact from an earlier workflow phase,\n"
              "- the outputs are detailed enough to drive both the review-fix phase and the final human walkthrough.",
              "- the review and generated review-fix prompt remain usable without any artifact from an earlier workflow phase,\n"
              "- when frontend design applies, objective visual findings are grounded in rendered evidence and the locked contract or repository requirements; uncontracted aesthetic alternatives remain suggestions,\n"
              "- the outputs are detailed enough to drive both the review-fix phase and the final human walkthrough.",
              path,
          )
          text = replace_once(
              text,
              "- separate confirmed issues from preferences, open questions, and optional suggestions,\n"
              "- do not recreate missing prior-phase artifacts or treat their absence as a review defect,",
              "- separate confirmed issues from preferences, open questions, and optional suggestions,\n"
              "- when frontend design applies, inspect the rendered UI at representative desktop and mobile viewports using existing repository tooling when available; if tooling is unavailable, record the limitation and do not claim rendered verification,\n"
              "- do not recreate missing prior-phase artifacts or treat their absence as a review defect,",
              path,
          )
          FRONTEND_REVIEW_SECTION = dedent("""
          ### Conditional frontend-design review

          Apply this subsection only when the task passes the applicability gate.

          - Establish the review baseline from the locked `Frontend Design Contract` when present, then existing brand and design-system conventions, actual rendered behavior, accessibility, responsive correctness, functionality, performance, SEO, analytics, and repository evidence.
          - Inspect representative desktop and mobile viewports with existing browser, preview, screenshot, or end-to-end tooling when available.
          - Review typography, hierarchy, layout, spacing, color and surface consistency, motion and reduced-motion behavior, imagery, loading and empty and error states, keyboard behavior, contrast, overflow, viewport stability, and Core Web Vitals risk only where relevant to the changed surface.
          - Treat contract violations, accessibility failures, overflow, broken responsive behavior, functional regressions, unapproved dependencies, SEO or analytics breakage, and measurable performance regressions as real findings.
          - Treat a different font, composition, animation, card treatment, or aesthetic direction as a suggestion unless the user or locked contract required it.
          - Do not use the skill to demand a redesign outside the branch scope.

          """)
          text = insert_before_once(
              text,
              "### Language-specific review guidance",
              FRONTEND_REVIEW_SECTION,
              path,
          )
          text = replace_once(
              text,
              "## Cross-Platform Review\n\n## Test Review",
              "## Cross-Platform Review\n\n## Frontend Design Review\n\n## Test Review",
              path,
          )
          text = replace_once(
              text,
              "In `## Documentation Review`, record the documentation-checkpoint result for every material changed behavior. Treat missing, inaccurate, or unvalidated required durable documentation as a valid review issue rather than an optional suggestion.\n",
              "In `## Documentation Review`, record the documentation-checkpoint result for every material changed behavior. Treat missing, inaccurate, or unvalidated required durable documentation as a valid review issue rather than an optional suggestion.\n\n"
              "In `## Frontend Design Review`, state `Not applicable` when the gate is false. When it is true, record the locked baseline, rendered viewports and tooling, objective failures, responsive and accessibility evidence, performance or SEO or analytics risks, and any unverified limitation. Keep uncontracted aesthetic alternatives in `Suggestions`.\n",
              path,
          )
          text = insert_before_once(
              text,
              "The generated GPT prompt must embed the full Engineering Contract above verbatim or stricter.",
              GENERATED_GATE_INSTRUCTIONS,
              path,
          )
          text = replace_once(
              text,
              "- each implemented fix is validated against the actual review finding and the current code,\n"
              "- all valid findings in `Blocking Issues` and `Non-Blocking Issues` are fixed, including minor non-blocking issues,",
              "- each implemented fix is validated against the actual review finding and the current code,\n"
              "- when valid frontend-design findings exist, each fix also satisfies the locked contract and is rechecked at the affected rendered viewports without expanding into a redesign,\n"
              "- all valid findings in `Blocking Issues` and `Non-Blocking Issues` are fixed, including minor non-blocking issues,",
              path,
          )
          FRONTEND_FIX_PROCESS = dedent("""
          Conditional frontend-design fix process:

          - apply `design-taste-frontend` only when `REVIEW.md` contains valid findings for an eligible visual frontend surface,
          - use the exact accepted finding, current code, and any locked `Frontend Design Contract` as the fix boundary,
          - do not implement optional aesthetic suggestions or redesign adjacent sections,
          - do not add a dependency or change the design system, routes, navigation, content, information architecture, forms, analytics, or architecture unless the accepted finding and approved contract explicitly require it,
          - recheck each affected desktop and mobile viewport with existing repository tooling when available and report any unverified limitation.

          """)
          text = insert_before_once(
              text,
              "Focused verification:",
              FRONTEND_FIX_PROCESS,
              path,
          )
          text = replace_once(
              text,
              "## Documentation Checkpoints\n\n## Commits Created",
              "## Documentation Checkpoints\n\n## Frontend Design Verification\n\n## Commits Created",
              path,
          )
          text = replace_once(
              text,
              "In `## Documentation Checkpoints`, require GPT to list each review item's documentation status, the exact durable documentation and validation evidence when applicable, or the evidence-based `Not applicable` rationale.\n",
              "In `## Documentation Checkpoints`, require GPT to list each review item's documentation status, the exact durable documentation and validation evidence when applicable, or the evidence-based `Not applicable` rationale.\n\n"
              "In `## Frontend Design Verification`, require GPT to state `Not applicable` when no eligible frontend finding was fixed. Otherwise require the contract or accepted finding, affected viewports, tooling, rendered results, accessibility and responsive checks, and any unverified limitation.\n",
              path,
          )
          p.write_text(text, encoding="utf-8")

          path = "prompts/05_opus_verify_review_fixes.md"
          p = Path(path)
          text = p.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "- verify that every material changed behavior still has a completed documentation checkpoint,\n"
              "- decide whether the code is ready for final review-artifact refresh or needs another fix pass.",
              "- verify that every material changed behavior still has a completed documentation checkpoint,\n"
              "- when accepted frontend-design findings exist, verify them against the actual rendered surface and locked contract at the affected viewports without introducing new aesthetic requirements,\n"
              "- decide whether the code is ready for final review-artifact refresh or needs another fix pass.",
              path,
          )
          text = replace_once(
              text,
              "- each documentation-checkpoint result is checked against the actual branch, including the durable documentation and validation evidence or the `Not applicable` rationale,\n"
              "- any newly introduced issue is surfaced instead of hidden inside a pass verdict.",
