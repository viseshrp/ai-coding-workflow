name: Run conditional frontend design integration

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/integrate-design-taste-skill.yml
      - .github/workflows/run-design-taste-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.pull_request.head.ref == 'feat/conditional-design-taste-skill'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/conditional-design-taste-skill
          fetch-depth: 0

      - name: Execute the reviewed transformation
        shell: bash
        run: |
          python3 - <<'PYRUN'
          from pathlib import Path

          workflow_path = Path('.github/workflows/integrate-design-taste-skill.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "          PY\n\n      - name: Validate and commit"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          embedded = workflow[start:end]
          script = "\n".join(
              line[10:] if line.startswith('          ') else line
              for line in embedded.splitlines()
          )
          exec(compile(script, str(workflow_path), 'exec'), {'__name__': '__main__'})
          PYRUN

      - name: Validate, remove temporary workflows, and commit
        shell: bash
        run: |
          rm -- \
            .github/workflows/integrate-design-taste-skill.yml \
            .github/workflows/run-design-taste-integration.yml

          git diff --check

          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"

          if printf '%s\n' "$changed" | grep -q '^sources/'; then
            echo "Source material was modified unexpectedly."
            exit 1
          fi

          expected="$(
            cat <<'EOF'
          .github/workflows/integrate-design-taste-skill.yml
          .github/workflows/run-design-taste-integration.yml
          AGENTS.md
          README.md
          prompts/01_initial_exploration_any_model.md
          prompts/02_plan_critique_gpt_gemini.md
          prompts/03_plan_revision_verification_gpt_gemini.md
          prompts/04_opus_review_branch.md
          prompts/05_opus_verify_review_fixes.md
          prompts/06_opus_refresh_review_and_walkthrough.md
          prompts/08_gpt_implement_human_followup.md
          EOF
          )"

          if [ "$(printf '%s\n' "$changed" | sort)" != "$(printf '%s\n' "$expected" | sort)" ]; then
            echo "Unexpected changed-file set."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            .github/workflows/integrate-design-taste-skill.yml \
            .github/workflows/run-design-taste-integration.yml \
            AGENTS.md \
            README.md \
            prompts/01_initial_exploration_any_model.md \
            prompts/02_plan_critique_gpt_gemini.md \
            prompts/03_plan_revision_verification_gpt_gemini.md \
            prompts/04_opus_review_branch.md \
            prompts/05_opus_verify_review_fixes.md \
            prompts/06_opus_refresh_review_and_walkthrough.md \
            prompts/08_gpt_implement_human_followup.md

          git commit \
            -m "Integrate conditional frontend design skill" \
            -m "Add design-taste-frontend only to eligible visual frontend phases, propagate the gate into generated planning, execution, revision, and review-fix prompts, require a locked Frontend Design Contract, add rendered review evidence, keep human review and test writing independent, and document synchronization rules without changing immutable source inputs."

          git push origin HEAD:feat/conditional-design-taste-skill
